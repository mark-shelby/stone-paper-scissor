<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="org"></div>
    <script>
        // console.log("Heelo");
        let compScore=0;
        let humanScore=0;

        function getComputerChoice(){
            let choice=Math.floor(Math.random()*3)+1;
            // console.log(choice);
            return choice;
        }
        
        function getHumanChoice(){
            let x=prompt("Enter your choice : rock , paper or scissor").toUpperCase();
            if(x==="ROCK") return 1;
            else if(x==="PAPER") return 2;
            return 3;
            // return x;
        }
       
        function playRound(c,h){
            if (humanScore >= 5 || compScore >= 5) return;

            if(h === 1) {
                if(c === 1) roundResult.textContent = "Tie!";
                else if(c === 2) { roundResult.textContent = "Computer wins!"; compScore++; }
                else { roundResult.textContent = "You win!"; humanScore++; }
            }
            else if(h === 2) {
                if(c === 1) { roundResult.textContent = "You win!"; humanScore++; }
                else if(c === 2) roundResult.textContent = "Tie!";
                else { roundResult.textContent = "Computer wins!"; compScore++; }
            }
            else {
                if(c === 1) { roundResult.textContent = "Computer wins!"; compScore++; }
                else if(c === 2) { roundResult.textContent = "You win!"; humanScore++; }
                else roundResult.textContent = "Tie!";
            }

            // Display running score
            runningScore.textContent = `Player: ${humanScore} | Computer: ${compScore}`;

            // Check if someone reached 5 points
            if (humanScore === 5) {
                finalWinner.textContent = "You win the game!";
                disableButtons();
            } else if (compScore === 5) {
                finalWinner.textContent = "Computer wins the game!";
                disableButtons();
            }
        }
        
        const div=document.querySelector("div");
        // let x=getHumanChoice();
        function disableButtons() {
            btn1.disabled = true;
            btn2.disabled = true;
            btn3.disabled = true;
        }
        
        const btn1=document.createElement("button");
        btn1.textContent="ROCK";
        const btn2=document.createElement("button");
        btn2.textContent="PAPER";
        const btn3=document.createElement("button");
        btn3.textContent="SCISSOR";

        const roundResult = document.createElement("p");
        const runningScore = document.createElement("h3");
        const finalWinner = document.createElement("h2");

        div.appendChild(btn1);
        div.appendChild(btn2);
        div.appendChild(btn3);
        div.appendChild(roundResult);
        div.appendChild(runningScore);
        div.appendChild(finalWinner);

        
        

        btn1.addEventListener('click', () => { playRound(getComputerChoice(), 1) });
        btn2.addEventListener('click', () => { playRound(getComputerChoice(), 2) });
        btn3.addEventListener('click', () => { playRound(getComputerChoice(), 3) });
        
        // getComputerChoice();
        // getHumanChoice();
    </script>
</body>
</html>
